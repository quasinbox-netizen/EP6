[project]
name = "btc-cycle-lab"
version = "0.1.0"
description = "A local research lab for cycles and macro events in the price of BTC"
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["bitcoin", "event-study", "backtesting", "research", "statistics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/quasinbox-netizen/EP6"
Issues = "https://github.com/quasinbox-netizen/EP6/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# basetemp is pinned inside the project because the system temp directory is
# not writable on every machine (Windows raises PermissionError there).
addopts = "-q --basetemp=.pytest-tmp"
markers = [
    "network: tests that reach real APIs",
]
