# btc-cycle-lab - project configuration.
# Every path is relative to the repository root.

paths:
  raw: data/raw
  processed: data/processed
  db: data/processed/lab.sqlite

price:
  symbol: BTCUSD
  # Which sources to download.
  sources: [binance, bitstamp, coinbase]
  # Stitching order: for a given day the first source that has it wins.
  # Binance is the deepest market but starts on 2017-08-17, so the 2012 and
  # 2016 halvings are covered by Bitstamp alone.
  stitch_priority: [binance, bitstamp, coinbase]
  start: "2011-08-18"     # the first BTC/USD session on Bitstamp
  # Largest acceptable median divergence on the overlap between sources.
  # Binance quotes BTC/USDT, so USDT de-pegging episodes show up here.
  overlap_tolerance: 0.01
  # A daily bar closes at 00:00 UTC of the following day.
  timezone: UTC

# Control group - assets that do NOT have a halving.
# The point: if the "halving effect" is visible here too, it is not a halving
# effect but the common move of risk assets over that period. The comparison is
# paired across events (difference in differences), because the same halvings
# fall in the same macro conditions for both assets.
control:
  symbols:
    NASDAQ: "^IXIC"     # equity index - the closest analogue of "risk" for BTC
    SP500: "^GSPC"      # the broader market
    GOLD: "GC=F"        # a supply-limited asset, but with no emission schedule
  primary: NASDAQ
  source: yahoo
  start: "2011-01-01"
  # The NASDAQ trades ~252 days a year, Bitcoin 365. Windows are counted in
  # CALENDAR days (the control series is mapped onto the calendar by carrying
  # the last known close forward); otherwise "365 days after the halving"
  # would mean almost 17 months for the NASDAQ.
  align: calendar

macro:
  # Yahoo Finance series - no API key, known the same day after the close.
  yahoo:
    dxy: "DX-Y.NYB"       # dollar index
    spx: "^GSPC"
    us10y: "^TNX"         # 10-year yield
    us13w: "^IRX"         # 13-week bill, a proxy for the short rate
    gold: "GC=F"
  # FRED series - require a free key (FRED_API_KEY in .env).
  # publication_lag_days = how many days after the end of the observation
  # period the value becomes publicly known. This is the only safeguard
  # against look-ahead bias in macro data.
  fred:
    m2:
      series_id: M2SL
      # Fallback lag, used only when no publication date is available from the
      # vintage archive. Measured on the real M2SL vintages: median 43 days,
      # max 58 - two weeks more than the intuitive "a month after period end".
      publication_lag_days: 45
      frequency: monthly
    indpro:
      series_id: INDPRO
      publication_lag_days: 17
      frequency: monthly
    fed_funds:
      series_id: DFF
      # DFF has over 5000 vintage dates, more than the FRED limit for first
      # releases (2000). We fetch it without the vintage archive - for a daily
      # series published the next day and essentially never revised, a fixed
      # one-day lag is faithful.
      publication_lag_days: 1
      frequency: daily
    unrate:
      series_id: UNRATE
      publication_lag_days: 7
      frequency: monthly
  # ISM Manufacturing PMI is not available through FRED (ISM licence).
  # If you have your own copy, drop it into data/raw/manual/pmi.csv
  # in the format: observation_date,value[,available_from]
  manual_dir: data/raw/manual

features:
  # Event windows used by features/events.py and by the analysis.
  event_windows: [7, 30, 90]
  halving_windows: [30, 90, 180, 365]

backtest:
  # One-way costs, in basis points of turnover.
  fee_bps: 10.0
  slippage_bps: 15.0
  # A signal computed at the close of day t collects the return of day t+lag.
  execution_lag_days: 1
  initial_equity: 10000.0
  # Trading days per year - Bitcoin trades all 365.
  periods_per_year: 365

validation:
  # Split by halving cycle: training cycles vs test cycles.
  train_cycles: [0, 1, 2]
  test_cycles: [3, 4]
  alpha: 0.05
  fdr_method: bh          # bh | bonferroni
  bootstrap_iterations: 2000
  block_length_days: 30   # block bootstrap - BTC has volatility autocorrelation
  random_seed: 20260901
  # Walk-forward validation - a dozen or more disjoint test windows instead of
  # a single split by cycle. The embargo must cover the target horizon, because
  # fwd_return_90d on the last training day contains prices from the test set.
  walk_forward:
    train_days: 730
    test_days: 365
    # The step MUST be >= test_days, otherwise the test windows overlap and the
    # t-test across folds stops being valid (it would understate the p-value).
    # The pipeline checks disjointness on the actual indices and, when they
    # overlap, does not report the t-test at all - only the sign test remains.
    step_days: 365
    embargo_days: 90
    expanding: true     # the training window grows, as it would in practice
