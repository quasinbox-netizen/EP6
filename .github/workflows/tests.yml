name: tests

# All three platforms on every push. Actions minutes are free on public
# repositories, so the earlier split - macOS on a weekly schedule because
# GitHub bills those runners at ten times the Linux rate - no longer buys
# anything, and one workflow that tests everything cannot drift out of step
# with a second one that tests the same thing differently.
#
# The job runs run.py rather than pytest directly, so every run exercises the
# same installation path a user goes through: interpreter discovery, virtual
# environment creation, dependency install. A launcher that breaks on one
# platform would otherwise be found by a user, not by CI.
#
# Network tests are excluded - they query Binance, Bitstamp and FRED, and
# hitting third-party APIs from CI on every push means rate limits and a flaky
# pipeline that people stop reading. They run weekly in api-contract.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.11 is the declared minimum, 3.13 is what the project was built on.
        # The versions in between rarely add anything.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show the environment
        run: python run.py doctor

      - name: Check the POSIX launcher is executable and runs
        if: runner.os != 'Windows'
        run: |
          test -x ./btc || { echo "btc lost its execute bit"; exit 1; }
          ./btc doctor > /dev/null

      - name: Run the offline test suite
        run: python run.py test offline
