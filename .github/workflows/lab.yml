# The lab's two scheduled jobs, in the cloud instead of on one PC.
#
# Every fifteen minutes: the agent looks at the price and publishes its feed.
# A public repository has no Actions quota to spend, which is why this is back
# to quarter-hourly after a spell at hourly.
# Once a day after 08:00 (Warsaw): refresh prices, rebuild the sizing, record
# the day's claims, rebuild the site, push. See scripts/cloud_run.py for why
# "once a day" is checked on every tick rather than scheduled at 08:00.
#
# The site is served by GitHub Pages from docs/ on main, which is why the
# repository is public. Public is not the same as advertised: the pages ask
# not to be indexed, and the way in is the page on quasipi.tech. The Cloudflare
# path (functions/, scripts/cloud_deploy.sh) is kept for the day a real
# password is wanted; without its secrets the deploy step does nothing.
#
# The state between runs (database, journal, ledger) is encrypted with the
# STATE_KEY secret - see scripts/cloud_state.sh for why it must be. Without
# the secret every run stops at the first step and does nothing.
name: Lab

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "Run the daily refresh now, whatever the time"
        type: boolean
        default: false
      deploy:
        description: "Deploy the site even if the pages did not change"
        type: boolean
        default: false

permissions:
  contents: write   # commit the rebuilt site and the agent feed
  actions: write    # prune old state caches

# One run at a time: two runs restoring the same state and each saving its own
# would lose whatever the first one recorded.
concurrency:
  group: lab-state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      STATE_KEY: ${{ secrets.STATE_KEY }}
      TZ: Europe/Warsaw
      PYTHONUNBUFFERED: "1"
      LAB_FORCE_DAILY: ${{ inputs.daily && 'true' || 'false' }}
      LAB_FORCE_DEPLOY: ${{ inputs.deploy && 'true' || 'false' }}
    steps:
      - name: Check for the state key
        id: key
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::warning::The STATE_KEY secret is not set, so there is no state to run from. Nothing was done."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install
        if: steps.key.outputs.ready == 'true'
        run: pip install -r requirements-cloud.txt

      - name: Restore state
        if: steps.key.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .state/state.enc
          key: lab-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lab-state-

      - name: Unpack state
        id: unpack
        if: steps.key.outputs.ready == 'true'
        run: bash scripts/cloud_state.sh unpack

      - name: Run
        id: run
        if: steps.unpack.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/cloud_run.py

      - name: Deploy to Cloudflare Pages
        if: always() && steps.unpack.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: bash scripts/cloud_deploy.sh

      # The deploy's own account of itself, committed so that it can be read
      # from outside a private repository. Only when it changed, so that an
      # unattended job does not add a commit an hour saying the same thing.
      - name: Report the deploy
        if: always() && steps.unpack.outcome == 'success'
        run: |
          git add -A data/status
          if ! git diff --cached --quiet; then
            git commit -m "Cloud deploy status"
            branch="$(git rev-parse --abbrev-ref HEAD)"
            git push origin HEAD || { git pull --rebase origin "$branch" && git push origin HEAD; }
          fi

      # Saved even when the run failed: a journal line or a recorded claim is
      # still worth keeping, and the next run starts from it.
      - name: Pack state
        if: always() && steps.unpack.outcome == 'success'
        run: bash scripts/cloud_state.sh pack

      - name: Save state
        if: always() && steps.unpack.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .state/state.enc
          key: lab-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Caches expire after a week unused and can be evicted; the branch is the
      # copy that survives that. Once a day is enough - it loses a day at most.
      - name: Refresh the seed
        if: steps.run.outputs.daily == 'true'
        run: bash scripts/cloud_state.sh seed

      - name: Prune old state caches
        if: always() && steps.unpack.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key lab-state- --limit 100 --sort created_at --order desc --json id --jq '.[5:][].id' \
            | xargs -r -n1 gh cache delete || true
